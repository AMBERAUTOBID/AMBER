name: Checks

# Runs on every push to every branch, and on every pull request.
#
# The point is that nobody has to remember. Two Claude sessions regularly edit
# this repo at the same time, so a change from one can break the other's work
# with nothing to flag it - that is exactly what this catches, at push time,
# instead of at the next Vercel deploy.
#
# The bot workflow's automated commits carry [skip ci] in their message, so
# they don't trigger a run here.
on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: this workflow inspects the code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older still-running check -
# no point spending minutes verifying a commit that's already superseded.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the telegram-bot workflow. Next 16 requires Node 20.9+.
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Ordered cheapest-first, so an obvious break reports in seconds rather
      # than after a full production build.
      - name: Typecheck
        run: npm run typecheck

      - name: Locale parity
        run: npm run check:locales

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # The strongest check, and the one that matters most: this is the same
      # command Vercel runs. If it passes here, the deploy will not fail to
      # build. Placeholder secrets below - no page fetches Apibara at build
      # time (search and vehicle pages are server-rendered on demand), so real
      # keys aren't needed and must not be put in a workflow that runs on
      # every branch.
      - name: Production build
        env:
          APIBARA_API_KEY: placeholder-not-used-at-build-time
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: placeholder
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
        run: npm run build
